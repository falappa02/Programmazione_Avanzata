$kind: http-request
url: http://localhost:3000/api/v1/auth/login
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "user1@univpm.it",
      "password": "PasswordSbagliata123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });

      const res = pm.response.json();
      pm.test("Errore strutturato restituito", function () {
          pm.expect(res.success).to.be.false;
          pm.expect(res.error).to.have.property('message');
          pm.expect(res.error.statusCode).to.eql(401);
      });
    language: text/javascript
order: 1000
