$kind: http-request
url: http://localhost:3000/api/v1/inference/models
method: GET
headers:
  Authorization: Bearer {{jwt_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      const res = pm.response.json();
      pm.test("Modello yolov11n presente nei modelli supportati", function () {
          pm.expect(res.success).to.be.true;
          pm.expect(res.data).to.have.property('supportedModels');
          pm.expect(res.data.supportedModels).to.include('yolov11n');
      });
    language: text/javascript
order: 1000
