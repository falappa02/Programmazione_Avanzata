$kind: http-request
url: http://localhost:3000/api/v1/users/credit
method: GET
headers:
  Authorization: Bearer {{jwt_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      const res = pm.response.json();
      pm.test("Risposta contiene il bilancio crediti valido", function () {
          pm.expect(res.success).to.be.true;
          pm.expect(res.data).to.have.all.keys('userId', 'email', 'tokens');
          pm.expect(res.data.tokens).to.be.a('number');
          pm.expect(res.data.tokens).to.be.at.least(0);
      });
    language: text/javascript
order: 1000
