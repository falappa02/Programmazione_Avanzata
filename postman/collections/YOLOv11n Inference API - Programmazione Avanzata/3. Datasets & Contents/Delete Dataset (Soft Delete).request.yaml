$kind: http-request
url: http://localhost:3000/api/v1/datasets/{{dataset_id}}
method: DELETE
headers:
  Authorization: Bearer {{jwt_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      const res = pm.response.json();
      pm.test("Dataset cancellato con successo (soft-delete)", function () {
          pm.expect(res.success).to.be.true;
      });
    language: text/javascript
order: 5000
