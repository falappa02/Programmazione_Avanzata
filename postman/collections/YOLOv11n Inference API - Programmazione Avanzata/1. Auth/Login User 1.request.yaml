$kind: http-request
url: http://localhost:3000/api/v1/auth/login
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "user1@univpm.it",
      "password": "User123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Tempo di risposta < 800ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(800);
      });

      const res = pm.response.json();
      pm.test("Login riuscito e token presente", function () {
          pm.expect(res.success).to.be.true;
          pm.expect(res.data).to.have.property('token');
          pm.expect(res.data.user.role).to.eql('user');
      });

      if (res.success && res.data && res.data.token) {
          pm.collectionVariables.set("jwt_token", res.data.token);
          pm.environment.set("jwt_token", res.data.token);
          console.log("✅ [Postman] jwt_token salvato con successo!");
      }
    language: text/javascript
order: 2000
