$kind: http-request
url: http://localhost:3000/api/v1/auth/login
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@univpm.it",
      "password": "Admin123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      const res = pm.response.json();
      pm.test("Admin autenticato con ruolo admin", function () {
          pm.expect(res.success).to.be.true;
          pm.expect(res.data.user.role).to.eql('admin');
          pm.expect(res.data).to.have.property('token');
      });

      if (res.success && res.data && res.data.token) {
          pm.collectionVariables.set("admin_jwt_token", res.data.token);
          pm.environment.set("admin_jwt_token", res.data.token);
          console.log("✅ [Postman] admin_jwt_token salvato con successo!");
      }
    language: text/javascript
order: 3000
