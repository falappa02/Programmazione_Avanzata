$kind: http-request
url: http://localhost:3000/api/v1/auth/register
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "user1@univpm.it",
      "password": "User123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Tempo di risposta < 1000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });

      const res = pm.response.json();
      pm.test("Registrazione valida e token restituito", function () {
          pm.expect(res.success).to.be.true;
          pm.expect(res.data).to.have.property('token');
          pm.expect(res.data.user.email).to.eql('user1@univpm.it');
      });

      if (res.success && res.data && res.data.token) {
          pm.collectionVariables.set("jwt_token", res.data.token);
          pm.environment.set("jwt_token", res.data.token);
          console.log("✅ [Postman] jwt_token salvato per user1!");
      }
    language: text/javascript
order: 1000
